{% extends "base.html" %}
{% block title %}Excluir competição — LifeOS{% endblock %}
{% block content %}
<h1>Excluir competição?</h1>
<p>Tem certeza que deseja excluir a competição de "<strong>{{ competition.date }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'sports-home' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}

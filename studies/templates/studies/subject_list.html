{% extends "base.html" %}
{% block title %}Estudos — LifeOS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Matérias</h1>
    <div>
        <a href="{% url 'subject-create' %}" class="btn btn-dark">+ Nova matéria</a>
        <a href="{% url 'studylog-create' %}" class="btn btn-outline-dark">+ Tempo estudado</a>
    </div>
</div>
<div class="list-group">
    {% for subject in subjects %}
        <a href="{% url 'subject-detail' subject.pk %}" class="list-group-item list-group-item-action">
            {{ subject.name }}
        </a>
    {% empty %}
        <p>Nenhuma matéria cadastrada ainda.</p>
    {% endfor %}
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>LifeOS — Excluir tarefa</title></head>
<body>
    <h1>Excluir tarefa?</h1>
    <p>Tem certeza que deseja excluir "{{ task.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
    </form>
    <a href="{% url 'task-list' %}">Cancelar</a>
</body>
</html>

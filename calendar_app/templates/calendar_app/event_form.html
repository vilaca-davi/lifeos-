{% extends "base.html" %}
{% block title %}Evento — LifeOS{% endblock %}
{% block content %}
<h1 class="mb-3">Evento</h1>
<form method="post" class="card p-4" style="max-width: 500px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark">Salvar</button>
    {% if form.instance.pk %}
        <a href="{% url 'event-delete' form.instance.pk %}" class="btn btn-outline-danger">Excluir</a>
    {% endif %}
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Excluir evento — LifeOS{% endblock %}
{% block content %}
<h1>Excluir evento?</h1>
<p>Tem certeza que deseja excluir "<strong>{{ event.title }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'calendar-month' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}

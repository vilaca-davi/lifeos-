<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LifeOS{% endblock %}</title>
{% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet"></head>
<body class="bg-light">
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard-home' %}">LifeOS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'dashboard-home' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'task-list' %}">Tarefas</a>
                <a class="nav-link" href="{% url 'subject-list' %}">Estudos</a>
                <a class="nav-link" href="{% url 'calendar-month' %}">Calendário</a>
                                <a class="nav-link" href="{% url 'logout' %}">Sair</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
